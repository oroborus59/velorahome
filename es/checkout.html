<style>
  :root {
    --color-bg: #ffffff;
    --color-fg: #111111;
    --color-fg-muted: #6f6f6f;
    --color-primary: #111111;
    --color-primary-dark: #000000;
    --color-primary-contrast: #ffffff;
    --color-tan-light: #f5f5f5;
    --color-tan: #ececec;
    --color-border: #e2e2e2;
    --color-success: #1a7f37;
    --color-error: #b3261e;
    --font-body: "Work Sans", "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--color-fg);
    background: var(--color-bg);
  }
  a { color: inherit; }
  header.site-header {
    display: flex;
    align-items: center;
    padding: 18px 16px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-tan-light);
  }
  header.site-header img { height: 32px; width: auto; }
  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }
  h1.page-title {
    font-size: 1.5rem;
    font-weight: 600;
    margin: 8px 0 24px;
  }
  .checkout-layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 32px;
  }
  @media (min-width: 760px) {
    .checkout-layout { grid-template-columns: 1.15fr 0.85fr; }
  }
  .order-summary {
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 16px;
    height: fit-content;
  }
  .order-summary h2 {
    font-size: 1rem;
    font-weight: 600;
    margin: 0 0 14px;
  }
  .order-summary__row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--color-border);
    font-size: 0.9rem;
  }
  .order-summary__row:last-of-type { border-bottom: none; }
  .order-summary__total {
    display: flex;
    justify-content: space-between;
    padding-top: 12px;
    margin-top: 8px;
    border-top: 2px solid var(--color-fg);
    font-weight: 600;
  }
  .bizum-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 16px;
    padding: 8px 12px;
    background: var(--color-tan-light);
    border-radius: 6px;
    font-size: 0.82rem;
    color: var(--color-fg-muted);
  }
  form.checkout-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .form-row { display: flex; flex-direction: column; gap: 6px; }
  .form-row label {
    font-size: 0.85rem;
    font-weight: 600;
  }
  .form-row input {
    padding: 12px;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: var(--font-body);
    color: var(--color-fg);
    background: #fff;
  }
  .form-row input:focus {
    outline: none;
    border-color: var(--color-fg);
  }
  .form-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .phone-field {
    display: flex;
    gap: 8px;
  }
  .phone-field .phone-prefix {
    display: flex;
    align-items: center;
    padding: 0 12px;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    background: var(--color-tan-light);
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--color-fg-muted);
  }
  .phone-field input { flex: 1; }
  .pay-btn {
    margin-top: 8px;
    padding: 15px;
    background: var(--color-primary);
    color: var(--color-primary-contrast);
    border: none;
    border-radius: 4px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  .pay-btn:hover { background: var(--color-primary-dark); }
  .pay-btn:disabled { opacity: 0.6; cursor: default; }
  .form-error {
    color: var(--color-error);
    font-size: 0.85rem;
    min-height: 1.1em;
  }
  .status-view {
    text-align: center;
    padding: 32px 16px;
  }
  .status-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
  }
  .status-icon.loading { background: var(--color-tan-light); color: var(--color-fg-muted); }
  .status-icon.error { background: #fbeceb; color: var(--color-error); }
  .status-view h2 {
    font-size: 1.2rem;
    font-weight: 600;
    margin: 0 0 10px;
  }
  .status-view p {
    color: var(--color-fg-muted);
    font-size: 0.92rem;
    margin: 0 0 24px;
  }
  .retry-btn {
    padding: 12px 28px;
    background: var(--color-primary);
    color: var(--color-primary-contrast);
    border: none;
    border-radius: 4px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .retry-btn:hover { background: var(--color-primary-dark); }
  [hidden] { display: none !important; }
  .cart-empty {
    text-align: center;
    padding: 48px 16px;
    color: var(--color-fg-muted);
  }
  .cart-empty a {
    display: inline-block;
    margin-top: 16px;
    padding: 12px 24px;
    background: var(--color-primary);
    color: var(--color-primary-contrast);
    text-decoration: none;
    border-radius: 4px;
    font-weight: 600;
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html"><img src="../cdn/shop/files/velora_logo.webp@height=156&v=1784760651" alt="Velora Home"></a>
</header>

<main>
  <h1 class="page-title">Finalizar compra</h1>

  <div id="empty-root" hidden>
    <div class="cart-empty">
      <p>No hay artículos para pagar.</p>
      <a href="cart.html">Volver al carrito</a>
    </div>
  </div>

  <div id="checkout-root" hidden>
    <div class="checkout-layout">
      <div>
        <form class="checkout-form" id="checkout-form">
          <div class="form-row">
            <label for="f-name">Nombre completo</label>
            <input type="text" id="f-name" name="name" autocomplete="name" required>
          </div>
          <div class="form-row">
            <label for="f-phone">Teléfono registrado en Bizum</label>
            <div class="phone-field">
              <span class="phone-prefix">+34</span>
              <input type="tel" id="f-phone" name="phone" inputmode="numeric" placeholder="600 000 000" autocomplete="tel-national" required>
            </div>
          </div>
          <div class="form-row">
            <label for="f-line1">Dirección</label>
            <input type="text" id="f-line1" name="line1" autocomplete="address-line1" required>
          </div>
          <div class="form-row">
            <label for="f-line2">Dirección (piso, puerta, etc.) — opcional</label>
            <input type="text" id="f-line2" name="line2" autocomplete="address-line2">
          </div>
          <div class="form-grid-2">
            <div class="form-row">
              <label for="f-city">Ciudad</label>
              <input type="text" id="f-city" name="city" autocomplete="address-level2" required>
            </div>
            <div class="form-row">
              <label for="f-postal">Código postal</label>
              <input type="text" id="f-postal" name="postalCode" inputmode="numeric" autocomplete="postal-code" required>
            </div>
          </div>
          <div class="form-row">
            <label>País</label>
            <input type="text" value="España" disabled>
          </div>
          <p class="form-error" id="form-error"></p>
          <button type="submit" class="pay-btn" id="pay-btn">Pagar con Bizum</button>
        </form>
      </div>

      <div class="order-summary">
        <h2>Resumen del pedido</h2>
        <div id="summary-items"></div>
        <div class="order-summary__total"><span>Total</span><span id="summary-total"></span></div>
        <div class="bizum-badge">📱 Vas a aprobar el pago desde tu app bancaria</div>
      </div>
    </div>
  </div>

  <div id="status-root" hidden></div>
</main>

<script>window.SITE_LOCALE = "es";</script><script src="../cart.js"></script>
<script>
(function () {
  var cart = window.VeloraCart;
  var items = cart.getCheckoutItems();

  var emptyRoot = document.getElementById("empty-root");
  var checkoutRoot = document.getElementById("checkout-root");
  var statusRoot = document.getElementById("status-root");
  var formErrorEl = document.getElementById("form-error");
  var payBtn = document.getElementById("pay-btn");

  var stripe = null;
  var clientSecret = null;

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderSummary() {
    var itemsRoot = document.getElementById("summary-items");
    var total = 0;
    itemsRoot.innerHTML = items.map(function (i) {
      var catalogEntry = null;
      for (var k = 0; k < cart.PRODUCTS.length; k++) {
        if (cart.PRODUCTS[k].handle === i.handle) { catalogEntry = cart.PRODUCTS[k]; break; }
      }
      var price = catalogEntry ? catalogEntry.price : 0;
      total += price * i.qty;
      return "<div class=\"order-summary__row\"><span>" + escapeHtml(i.title) + " × " + i.qty + "</span><span>" + cart.formatPrice(price * i.qty) + "</span></div>";
    }).join("");
    document.getElementById("summary-total").textContent = cart.formatPrice(total);
  }

  function showStatus(html) {
    checkoutRoot.hidden = true;
    statusRoot.hidden = false;
    statusRoot.innerHTML = html;
  }

  function showForm() {
    statusRoot.hidden = true;
    checkoutRoot.hidden = false;
  }

  function showWaiting() {
    showStatus(
      "<div class=\"status-view\">" +
        "<div class=\"status-icon loading\">…</div>" +
        "<h2>Confirma el pago en tu app bancaria</h2>" +
        "<p>Hemos enviado una notificación a tu app de Bizum. Aprueba el pago allí — esta página se actualizará sola. Puede tardar unos minutos, no cierres esta ventana.</p>" +
      "</div>"
    );
  }

  function showError(message) {
    showStatus(
      "<div class=\"status-view\">" +
        "<div class=\"status-icon error\">!</div>" +
        "<h2>No se pudo completar el pago</h2>" +
        "<p>" + escapeHtml(message || "Inténtalo de nuevo o revisa el número de teléfono introducido.") + "</p>" +
        "<button type=\"button\" class=\"retry-btn\" id=\"retry-btn\">Intentar de nuevo</button>" +
      "</div>"
    );
    document.getElementById("retry-btn").addEventListener("click", function () {
      showForm();
      payBtn.disabled = false;
    });
  }

  async function confirmBizumPayment(phone) {
    var result = await stripe.confirmPayment({
      clientSecret: clientSecret,
      confirmParams: {
        return_url: window.location.href,
        payment_method_data: {
          type: "bizum",
          billing_details: { phone: phone }
        }
      },
      redirect: "if_required"
    });

    if (result.error) {
      showError(result.error.message);
      return;
    }

    if (result.paymentIntent && result.paymentIntent.status === "succeeded") {
      cart.saveCart([]);
      window.location.href = "checkout-success.html?payment_intent=" + encodeURIComponent(result.paymentIntent.id);
    } else {
      showError("El pago no se ha podido confirmar.");
    }
  }

  document.getElementById("checkout-form").addEventListener("submit", function (e) {
    e.preventDefault();
    formErrorEl.textContent = "";

    var name = document.getElementById("f-name").value.trim();
    var phoneDigits = document.getElementById("f-phone").value.replace(/\D/g, "");
    var line1 = document.getElementById("f-line1").value.trim();
    var line2 = document.getElementById("f-line2").value.trim();
    var city = document.getElementById("f-city").value.trim();
    var postalCode = document.getElementById("f-postal").value.trim();

    if (!name || !line1 || !city || !postalCode) {
      formErrorEl.textContent = "Completa todos los campos obligatorios.";
      return;
    }
    if (phoneDigits.length !== 9) {
      formErrorEl.textContent = "Introduce un número de teléfono español válido (9 dígitos).";
      return;
    }

    var phone = "+34" + phoneDigits;
    payBtn.disabled = true;
    payBtn.textContent = "Procesando…";

    var proceed = clientSecret
      ? Promise.resolve()
      : fetch("/api/create-bizum-payment-intent", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            items: items,
            address: { name: name, phone: phone, line1: line1, line2: line2, city: city, postalCode: postalCode },
            trackingParams: cart.getTrackingParams()
          })
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (!data || !data.clientSecret || !data.publishableKey) {
              throw new Error(data && data.error ? data.error : "No se pudo iniciar el pago");
            }
            clientSecret = data.clientSecret;
            stripe = Stripe(data.publishableKey);
          });

    proceed
      .then(function () {
        showWaiting();
        return confirmBizumPayment(phone);
      })
      .catch(function (err) {
        showError(err && err.message);
      })
      .finally(function () {
        payBtn.disabled = false;
        payBtn.textContent = "Pagar con Bizum";
      });
  });

  if (items.length === 0) {
    emptyRoot.hidden = false;
  } else {
    renderSummary();
    showForm();
    cart.trackTikTok("InitiateCheckout", {
      contents: items.map(function (i) {
        return { content_id: i.handle, content_type: "product", content_name: i.title, quantity: i.qty };
      }),
      currency: cart.CURRENCY
    });
  }
})();
</script>
</body>
</html>
